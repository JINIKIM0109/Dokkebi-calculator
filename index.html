<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>도깨비 계산기</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #121a2d;
      --panel2: #18233a;
      --line: #293650;
      --text: #edf3ff;
      --muted: #94a3bd;
      --accent: #72a7ff;
      --accent2: #9b8cff;
      --good: #66d9ad;
      --danger: #ff7f91;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 32px 16px 56px;
      background: radial-gradient(ellipse at top, #182849 0%, var(--bg) 52%);
      color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap { width: min(920px, 100%); margin: 0 auto; }
    header { margin-bottom: 24px; }
    .eyebrow { color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .16em; }
    h1 { margin: 8px 0 6px; font-size: clamp(28px, 5vw, 40px); letter-spacing: -.04em; }
    .sub { color: var(--muted); margin: 0; line-height: 1.6; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card {
      background: linear-gradient(155deg, rgba(24,35,58,.96), rgba(18,26,45,.96));
      border: 1px solid var(--line); border-radius: 20px; padding: 22px;
      box-shadow: 0 16px 40px rgba(0,0,0,.18);
    }
    .card h2 { margin: 0 0 18px; font-size: 17px; }
    .field { margin-bottom: 15px; }
    label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 7px; }
    input {
      width: 100%; min-width: 0; padding: 13px 14px; border-radius: 11px;
      border: 1px solid var(--line); background: #0c1425; color: var(--text);
      font-size: 16px; outline: none;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(114,167,255,.13); }
    .time-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .results { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .metric { background: #0c1425; border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
    .metric span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .metric strong { font-size: clamp(23px, 4vw, 30px); letter-spacing: -.04em; color: var(--good); }
    .metric small { color: var(--muted); font-size: 12px; }
    .estimate { margin-top: 16px; padding: 16px; border-radius: 14px; background: rgba(114,167,255,.08); border: 1px solid rgba(114,167,255,.25); }
    .estimate strong { display: block; margin-top: 7px; color: var(--accent); font-size: 22px; }
    .estimate p { margin: 0; color: var(--muted); font-size: 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px; }
    button {
      border: 0; border-radius: 10px; padding: 11px 15px; cursor: pointer;
      font-weight: 700; font-size: 13px; transition: .15s ease;
    }
    button:hover { transform: translateY(-1px); filter: brightness(1.08); }
    .primary { background: var(--accent); color: #071326; }
    .secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
    .delete { background: rgba(255,127,145,.1); color: var(--danger); border: 1px solid rgba(255,127,145,.25); }
    .history-card { margin-top: 16px; }
    .history-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
    .history-head h2 { margin: 0; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 570px; font-size: 13px; }
    th, td { padding: 12px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
    th { color: var(--muted); font-weight: 600; }
    th:first-child, td:first-child { text-align: left; }
    .empty { color: var(--muted); text-align: center; padding: 28px 8px; font-size: 13px; }
    footer { color: var(--muted); text-align: center; font-size: 12px; margin-top: 22px; line-height: 1.7; }

    .item-form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
    .item-form .field { margin: 0; }
    .item-table button { padding: 7px 10px; margin-left: 5px; }
    .item-actions { white-space: nowrap; }
    @media (max-width: 680px) {
      .item-form { grid-template-columns: 1fr 1fr; }
      .item-form .form-button { grid-column: 1 / -1; }
    }

    @media (max-width: 680px) {
      body { padding: 22px 12px 40px; }
      .grid { grid-template-columns: 1fr; }
      .card { padding: 18px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="eyebrow">dokkebi calculator</div>
      <h1>도깨비 계산기</h1>
      <p class="sub">사냥 시간과 마리수를 입력하면 속도와 예상 완료 시간을 계산합니다.</p>
    </header>

    <section class="grid">
      <div class="card">
        <h2>① 사냥 정보 입력</h2>
        <div class="field">
          <label for="hours">소요 시간</label>
          <div class="time-row">
            <div><input id="hours" type="number" min="0" step="1" value="0" inputmode="numeric"><div class="hint">시간</div></div>
            <div><input id="minutes" type="number" min="0" step="1" value="8" inputmode="numeric"><div class="hint">분</div></div>
          </div>
        </div>
        <div class="field">
          <label for="count">사냥한 마리수</label>
          <input id="count" type="number" min="0" step="1" value="592" inputmode="numeric" placeholder="예: 592">
        </div>
        <div class="actions">
          <button class="primary" id="saveBtn">계산 결과 저장</button>
          <button class="secondary" id="resetBtn">입력 초기화</button>
        </div>
      </div>

      <div class="card">
        <h2>② 사냥 속도</h2>
        <div class="results">
          <div class="metric">
            <span>분당 사냥량</span>
            <strong id="perMinute">74.00</strong>
            <small>마리 / 분</small>
          </div>
          <div class="metric">
            <span>시간당 사냥량</span>
            <strong id="perHour">4,440</strong>
            <small>마리 / 시간</small>
          </div>
        </div>
        <div class="estimate">
          <p>목표 마리수까지 예상 시간</p>
          <div class="field" style="margin:10px 0 0">
            <input id="target" type="number" min="0" step="1" value="10000" inputmode="numeric" placeholder="목표 마리수">
          </div>
          <strong id="estimate">2시간 15분 8초</strong>
        </div>
      </div>
    </section>

    <section class="card history-card">
      <div class="history-head">
        <h2>③ 계산 기록</h2>
        <button class="delete" id="clearHistoryBtn">기록 전체 삭제</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>저장 시각</th><th>작업 시간</th><th>처리 개수</th><th>분당</th><th>시간당</th></tr></thead>
          <tbody id="historyBody"></tbody>
        </table>
        <div class="empty" id="emptyMessage">아직 저장된 기록이 없습니다.</div>
      </div>
    </section>
    <footer>기록은 현재 브라우저에 저장됩니다. 다른 기기나 브라우저와 자동 동기화되지는 않습니다.<br>도깨비 계산기</footer>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const numberFormat = (n, digits = 2) => Number(n).toLocaleString('ko-KR', {
      minimumFractionDigits: digits, maximumFractionDigits: digits
    });
    const wholeFormat = (n) => Math.round(n).toLocaleString('ko-KR');

    function getValues() {
      const h = Number($('hours').value);
      const m = Number($('minutes').value);
      const count = Number($('count').value);
      const target = Number($('target').value);
      const totalMinutes = h * 60 + m;
      return { h, m, count, target, totalMinutes };
    }

    function durationText(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return '계산할 수 없습니다.';
      let s = Math.ceil(seconds);
      const h = Math.floor(s / 3600); s %= 3600;
      const m = Math.floor(s / 60); s %= 60;
      const parts = [];
      if (h) parts.push(`${h}시간`);
      if (m) parts.push(`${m}분`);
      if (s || parts.length === 0) parts.push(`${s}초`);
      return parts.join(' ');
    }

    function calculate() {
      const v = getValues();
      const valid = Number.isFinite(v.totalMinutes) && v.totalMinutes > 0 &&
        Number.isFinite(v.count) && v.count >= 0;
      const rate = valid ? v.count / v.totalMinutes : 0;
      $('perMinute').textContent = valid ? numberFormat(rate) : '—';
      $('perHour').textContent = valid ? wholeFormat(rate * 60) : '—';
      const estimateValid = valid && Number.isFinite(v.target) && v.target >= 0 && rate > 0;
      $('estimate').textContent = estimateValid
        ? durationText((v.target / rate) * 60)
        : (v.target === 0 && valid ? '0초' : '시간과 개수를 확인해 주세요.');
      return { ...v, rate, valid };
    }

    function loadHistory() {
      try { return JSON.parse(localStorage.getItem('throughputHistory') || '[]'); }
      catch { return []; }
    }
    function saveHistory(items) {
      localStorage.setItem('throughputHistory', JSON.stringify(items));
    }
    function renderHistory() {
      const items = loadHistory();
      $('historyBody').innerHTML = '';
      $('emptyMessage').style.display = items.length ? 'none' : 'block';
      items.forEach(item => {
        const tr = document.createElement('tr');
        [item.date, item.duration, wholeFormat(item.count), numberFormat(item.rate), wholeFormat(item.rate * 60)]
          .forEach(value => {
            const td = document.createElement('td');
            td.textContent = value;
            tr.appendChild(td);
          });
        $('historyBody').appendChild(tr);
      });
    }

    ['hours', 'minutes', 'count', 'target'].forEach(id => $(id).addEventListener('input', calculate));

    $('saveBtn').addEventListener('click', () => {
      const v = calculate();
      if (!v.valid) {
        alert('소요 시간을 1분 이상 입력하고 처리 개수를 확인해 주세요.');
        return;
      }
      const items = loadHistory();
      const date = new Date().toLocaleString('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
      items.unshift({
        date,
        duration: `${v.h}시간 ${v.m}분`,
        count: v.count,
        rate: v.rate
      });
      saveHistory(items.slice(0, 100));
      renderHistory();
    });

    $('resetBtn').addEventListener('click', () => {
      $('hours').value = 0; $('minutes').value = 0;
      $('count').value = ''; $('target').value = '';
      calculate();
    });

    $('clearHistoryBtn').addEventListener('click', () => {
      if (confirm('저장된 계산 기록을 모두 삭제할까요?')) {
        saveHistory([]);
        renderHistory();
      }
    });


    // 작업 항목 관리: 이름과 카테고리를 브라우저에 저장합니다.
    function loadItems() {
      try { return JSON.parse(localStorage.getItem('throughputItems') || '[]'); }
      catch { return []; }
    }
    function saveItems(items) {
      localStorage.setItem('throughputItems', JSON.stringify(items));
    }
    let editingItemId = null;

    function resetItemForm() {
      $('itemName').value = '';
      $('itemCategory').value = '';
      editingItemId = null;
      $('addItemBtn').textContent = '항목 추가';
      $('cancelEditBtn').style.display = 'none';
    }

    function renderItems() {
      const items = loadItems();
      const body = $('itemsBody');
      body.innerHTML = '';
      $('itemsEmpty').style.display = items.length ? 'none' : 'block';

      items.forEach(item => {
        const tr = document.createElement('tr');
        const nameTd = document.createElement('td');
        const categoryTd = document.createElement('td');
        const actionsTd = document.createElement('td');
        actionsTd.className = 'item-actions';

        nameTd.textContent = item.name;
        categoryTd.textContent = item.category;

        const editBtn = document.createElement('button');
        editBtn.className = 'secondary';
        editBtn.textContent = '수정';
        editBtn.addEventListener('click', () => {
          $('itemName').value = item.name;
          $('itemCategory').value = item.category;
          editingItemId = item.id;
          $('addItemBtn').textContent = '수정 저장';
          $('cancelEditBtn').style.display = 'inline-block';
          $('itemName').focus();
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete';
        deleteBtn.textContent = '삭제';
        deleteBtn.addEventListener('click', () => {
          if (!confirm(`'${item.name}' 항목을 삭제할까요?`)) return;
          saveItems(loadItems().filter(x => x.id !== item.id));
          if (editingItemId === item.id) resetItemForm();
          renderItems();
        });

        actionsTd.append(editBtn, deleteBtn);
        tr.append(nameTd, categoryTd, actionsTd);
        body.appendChild(tr);
      });
    }

    $('addItemBtn').addEventListener('click', () => {
      const name = $('itemName').value.trim();
      const category = $('itemCategory').value.trim();
      if (!name || !category) {
        alert('이름과 카테고리를 모두 입력해 주세요.');
        return;
      }

      const items = loadItems();
      if (editingItemId !== null) {
        const index = items.findIndex(x => x.id === editingItemId);
        if (index !== -1) items[index] = { ...items[index], name, category };
      } else {
        items.unshift({ id: Date.now().toString(), name, category });
      }
      saveItems(items);
      resetItemForm();
      renderItems();
    });

    $('cancelEditBtn').addEventListener('click', resetItemForm);

    calculate();
    renderHistory();
    renderItems();
  </script>
</body>
</html>
